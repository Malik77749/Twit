<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1120" role="img" aria-labelledby="title desc">
  <title id="title">ميمر Mimer</title>
  <desc id="desc">شعار ميمر: رمز محادثة على هيئة حرف M، واسم Mimer، وعبارة تواصل شارك، أول منصة عربية.</desc>
  <defs>
    <linearGradient id="wing" x1="190" y1="130" x2="820" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#18c8f4"/><stop offset=".5" stop-color="#087ff1"/><stop offset="1" stop-color="#164fe2"/></linearGradient>
    <linearGradient id="blueM" x1="250" y1="770" x2="400" y2="980" gradientUnits="userSpaceOnUse"><stop stop-color="#18c8f4"/><stop offset="1" stop-color="#164fe2"/></linearGradient>
    <radialGradient id="dot" cx="35%" cy="25%"><stop stop-color="#39dcff"/><stop offset="1" stop-color="#1269ed"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="15" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="1120" rx="72" fill="#030711"/>
  <g filter="url(#glow)">
    <path d="M188 548V300c0-105 122-167 202-87l110 110 110-110c80-80 202-18 202 87v248c0 103-116 165-199 92l-113-100-113 100c-83 73-199 11-199-92Z" fill="url(#wing)"/>
    <path d="M250 528V336c0-47 45-72 80-39l170 152 170-152c35-33 80-8 80 39v192c0 45-43 71-78 40l-113-101-59 53-59-53-113 101c-35 31-78 5-78-40Z" fill="#030711"/>
    <path d="M500 449 333 300c-37-33-83-5-83 42v191c0 45 43 71 78 40l113-101 59 53 59-53 113 101c35 31 78 5 78-40V342c0-47-46-75-83-42L500 449Z" fill="#030711" opacity=".92"/>
    <circle cx="408" cy="493" r="27" fill="url(#dot)"/><circle cx="500" cy="493" r="27" fill="url(#dot)"/><circle cx="592" cy="493" r="27" fill="url(#dot)"/>
  </g>
  <text x="500" y="790" text-anchor="middle" direction="ltr" font-family="Arial, Helvetica, sans-serif" font-size="142" font-weight="800" letter-spacing="-5"><tspan fill="url(#blueM)">M</tspan><tspan fill="#f7f9fc">imer</tspan></text>
  <g font-family="Arial, 'Noto Sans Arabic', sans-serif" text-anchor="middle">
    <text x="500" y="900" direction="rtl" font-size="52" font-weight="700"><tspan fill="#f7f9fc">تواصل</tspan><tspan fill="#31bdf4"> • </tspan><tspan fill="#20a9f4">شارك</tspan></text>
    <text x="500" y="977" direction="rtl" fill="#e5e7eb" font-size="38" font-weight="400">اول منصة عربية</text>
  </g>
</svg>
